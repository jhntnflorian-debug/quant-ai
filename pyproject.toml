[project]
name = "quant-ai"
version = "0.1.0"
description = "QUANT-AI: sistema de trading algorítmico con IA (modo PAPER por defecto)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "requests>=2.31",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "plotly>=5.20",
    "streamlit>=1.40",
]

[project.optional-dependencies]
# Deep learning (en Colab se usa el torch preinstalado con CUDA)
dl = ["torch>=2.3"]   # NO instalar en local: Colab ya trae torch con CUDA
# Aprendizaje por refuerzo
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3"]
# Búsqueda de hiperparámetros
tune = ["optuna>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "nbformat>=5.10"]   # los notebooks se ejecutan en Colab, no en local

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: pruebas que requieren Internet (se omiten por defecto con -m 'not network')"]

[tool.ruff]
line-length = 110
target-version = "py310"
